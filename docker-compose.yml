# Due modi di usarlo, dalla radice del repository:
#   docker compose up -d                    solo Postgres e RabbitMQ: i servizi si avviano con Maven
#   docker compose --profile app up -d --build
#                                           tutta l'applicazione in container, su http://localhost
# Password e segreti si leggono dal file .env (non tracciato, vedi .env.example);
# senza .env valgono i valori di sviluppo qui sotto e negli application.yml.

# Memoria dei servizi Java: senza limite ognuno prenderebbe fino a un quarto della RAM.
# Così i quattro servizi, Postgres e RabbitMQ stanno in una macchina da 2 GB.
x-java-memory: &java-memory "-Xmx256m -XX:MaxMetaspaceSize=128m -Xss512k -XX:+UseSerialGC"

services:
  db:
    image: postgres:16-alpine
    container_name: bugboard26_db
    environment:
      POSTGRES_DB: bugboard26
      POSTGRES_USER: bugboard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # Solo da questa macchina (127.0.0.1): Maven in locale lo raggiunge, Internet no.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Crea i database dei servizi al primo avvio (volume vuoto).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugboard -d bugboard26"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Coda dei messaggi fra i servizi (evento "issue risolta"). Pannello web: http://localhost:15672
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bugboard26_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: bugboard
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secret}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # --- L'applicazione (solo con --profile app) ---
  # Nessun servizio espone porte sulla macchina: si raggiungono fra loro per nome
  # (http://user-service:8081…), e da fuori si entra solo dal frontend.

  user-service:
    profiles: [app]
    build:
      context: ./Backend
      args:
        SERVICE: user-service
    env_file:
      - path: .env
        required: false
    environment:
      JAVA_TOOL_OPTIONS: *java-memory
      DB_URL: jdbc:postgresql://db:5432/bugboard_users
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  issue-service:
    profiles: [app]
    build:
      context: ./Backend
      args:
        SERVICE: issue-service
    env_file:
      - path: .env
        required: false
    environment:
      JAVA_TOOL_OPTIONS: *java-memory
      DB_URL: jdbc:postgresql://db:5432/bugboard_issues
      USER_SERVICE_URL: http://user-service:8081
      RABBITMQ_HOST: rabbitmq
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    profiles: [app]
    build:
      context: ./Backend
      args:
        SERVICE: notification-service
    env_file:
      - path: .env
        required: false
    environment:
      JAVA_TOOL_OPTIONS: *java-memory
      DB_URL: jdbc:postgresql://db:5432/bugboard_notifications
      RABBITMQ_HOST: rabbitmq
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    profiles: [app]
    build:
      context: ./Backend
      args:
        SERVICE: gateway
    environment:
      JAVA_TOOL_OPTIONS: *java-memory
      USER_SERVICE_URL: http://user-service:8081
      ISSUE_SERVICE_URL: http://issue-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
    depends_on:
      - user-service
      - issue-service
      - notification-service
    restart: unless-stopped

  frontend:
    profiles: [app]
    build: ./Frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  postgres_data:
  # Le immagini allegate alle issue: sopravvivono quando il container si ricrea.
  uploads_data:
