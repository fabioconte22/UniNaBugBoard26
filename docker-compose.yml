version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: bugboard26_db
    environment:
      POSTGRES_DB: bugboard26
      POSTGRES_USER: bugboard
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: