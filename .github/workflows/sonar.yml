name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - main
      - feature/issue
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    name: Build and Analyze
    runs-on: ubuntu-latest
    
    # Questo database temporaneo permette ai test di Spring Boot di non crashare
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bugboard26
          POSTGRES_USER: bugboard
          POSTGRES_PASSWORD: secret
        # Mappa la porta 5433 per rispettare il tuo application.yml
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    # Dice a GitHub di eseguire tutti i comandi dentro la cartella del backend
    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Cruciale: SonarQube ha bisogno della cronologia Git completa

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Il comando esegue i test e invia il report a SonarQube
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=fabioconte22_UniNaBugBoard26