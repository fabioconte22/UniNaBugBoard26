# notification-service. Ogni valore ${NOME:predefinito} si legge dalla variabile d'ambiente NOME;
# il predefinito va bene solo per lo sviluppo in locale.
server:
  port: ${PORT:8083}

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bugboard26}
    username: ${DB_USERNAME:bugboard}
    password: ${DB_PASSWORD:secret}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:bugboard}
    password: ${RABBITMQ_PASSWORD:secret}
    listener:
      simple:
        # Un messaggio che fa fallire il listener si scarta (con l'errore nel log) invece di
        # tornare in coda: altrimenti verrebbe riconsegnato all'infinito.
        default-requeue-rejected: false

# Deve essere lo stesso segreto di user-service, che firma i token.
jwt:
  secret: ${JWT_SECRET:ZGV2LXNvbG8tcGVyLXN2aWx1cHBvLWxvY2FsZS1idWdib2FyZDI2LW5vbi11c2FyZS1pbi1wcm9kdXppb25l}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
