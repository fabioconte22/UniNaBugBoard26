# Gateway: il frontend parla solo con lui, sulla porta 8080 come prima.
# Ogni valore ${NOME:predefinito} si legge dalla variabile d'ambiente NOME.
server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      # Il CORS si gestisce qui, una volta sola per tutti i servizi.
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
            allowed-methods: GET, POST, PUT, PATCH, DELETE, OPTIONS
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/admin/**
        - id: issue-service
          uri: ${ISSUE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/issue/**,/api/notifications/**,/uploads/**
      # /api/users/** (usato tra i servizi) non ha una rotta: dall'esterno non si raggiunge.
