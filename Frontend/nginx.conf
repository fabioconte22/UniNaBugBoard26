# Il browser parla solo con nginx: pagine e API arrivano dallo stesso indirizzo,
# quindi non serve il CORS (come in sviluppo con proxy.conf.json).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Un po' più del limite delle immagini (1 MB), come max-request-size di issue-service:
    # oltre, risponde issue-service con il suo 413 e il suo messaggio.
    client_max_body_size 3m;

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://gateway:8080;
    }

    # App a pagina singola: ogni indirizzo che non è un file (/issues/123, /dashboard…)
    # restituisce index.html, e la rotta la sceglie Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
