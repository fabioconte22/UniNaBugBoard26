<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>BugBoard26</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BugBoard26 - segnalazione e tracciamento dei bug.">
  <link rel="icon" type="image/png" href="favicon.png">
  <script>
    // Il tema si decide prima che parta Angular. La scelta salvata vince su quella di sistema.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('bugboard26.theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme:dark)').matches; 
      document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light'); 
    })(); 
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
