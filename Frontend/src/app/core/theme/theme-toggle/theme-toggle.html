<button
    type="button"
    class="btn btn-sm btn-outline-secondary"
    [attr.aria-label]="theme.theme() === 'dark' ? 'Passa al tema chiaro' : 'Passa al tema scuro'"
    [attr.title]="theme.theme() === 'dark' ? 'Tema chiaro' : 'Tema scuro'"
    (click)="theme.toggle()"
>
    <i [class]="theme.theme() === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars'" aria-hidden="true"></i>
</button>
