@if (auth.isAuthenticated()) {
    <nav class="navbar navbar-expand-md bg-body-tertiary border-bottom">
        <div class="container">
            <a 
                class="navbar-brand d-flex align-items-center gap-2"
                routerLink="/dashboard"
                (click)="closeMenu()"
            >
                <img src="logo.png" alt="" width="32" height="32" />
                <span class="fw-semibold">BugBoard26</span>
            </a>

            <button
                class="navbar-toggler"
                type="button"
                aria-controls="menu-principale"
                aria-label="Apri il menu"
                [attr.aria-expanded]="menuOpen()"
                (click)="toggleMenu()"
            >
                <span class="navbar-toggler-icon"></span>    
            </button>

            <div
                id="menu-principale"
                class="collapse navbar-collapse"
                [class.show]="menuOpen()"
            >
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a
                            class="nav-link"
                            routerLink="/dashboard"
                            routerLinkActive="active"
                            (click)="closeMenu()"
                        >
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a
                            class="nav-link"
                            routerLink="/issues"
                            routerLinkActive="active"
                            (click)="closeMenu()"
                        >
                            Issues
                        </a>
                    </li>
                    @if (auth.isAdmin()) {
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                routerLink="/admin/users"
                                routerLinkActive="active"
                                (click)="closeMenu()"
                            >
                               Utenti
                            </a>
                        </li>
                    }
                </ul>

                <div class="dropdown py-2 py-md-0">
                    <button 
                        type="button"
                        class="btn btn-sm btn-outline-secondary dropdown-toggle"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                    >
                        {{ auth.user()?.nome }}
                        <span class="badge text-bg-secondary ms-1">{{ auth.user()?.role }}</span>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <span class="dropdown-item-text small text-body-secondary">{{ auth.user()?.email }}</span>
                        </li>
                        <li><hr class="dropdown-divider" /></li>
                        <li>
                            <a 
                                class="dropdown-item"
                                routerLink="/profile"
                                routerLinkActive="active"
                                (click)="closeMenu()"
                            >
                                Profilo
                            </a>
                        </li>
                        <li>
                            <button type="button" class="dropdown-item" (click)="logout()">Esci</button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
}
